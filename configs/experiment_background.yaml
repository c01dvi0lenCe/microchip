run_id: pilot-background-example
video:
  video_id: pilot_e10_10_to_e10_11
  experiment_id: pilot_transport_horizontal_01
  batch_id: pilot_batch_01
  split: test
  path: ../data/raw_videos/pilot.mp4
electrode_map: electrode_map.yaml
output_dir: ../results/pilot-background
ground_truth_csv: ../data/annotations/pilot_annotations.csv
source_electrode: 190
target_electrode: 191
algorithm:
  name: background
  parameters:
    # This must be a dedicated blank-chip recording, never the test video.
    background_video: ../data/raw_videos/blank_chip.mp4
    background_sample_count: 25
    min_diff: 14
    min_area_px: 40
    morphology_kernel: 3
    open_iterations: 1
    close_iterations: 2
constraints:
  spatial:
    enabled: false
  temporal:
    enabled: false
